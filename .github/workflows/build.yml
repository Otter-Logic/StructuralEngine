name: build

# Build *and test*, like MachineLearning, Unsupervised and StructuralDesign.
# Reading a model is arithmetic over coordinate arrays and touches no Rhino
# API, so the tests need neither Rhino nor a licence.
#
# `windows-latest` only because the target framework is net7.0-windows, which
# follows Core rather than any need of this code. The test project sets
# RollForward=LatestMajor, so it runs on whatever the runner has.
#
# Every sibling in the transitive closure has to be on disk, named here or not:
# the csproj sibling toggles test for a directory, and a missing one falls
# through to a NuGet package that does not exist yet, which fails *restore* and
# reads as a missing package rather than a missing checkout.
#
# Cross-repo checkouts authenticate with OTTER_CI_TOKEN, a PAT with read access
# to Otter-Logic. The self-checkout keeps GITHUB_TOKEN deliberately: checkout
# persists whatever token it is given into the local git config, so the PAT goes
# only where it is needed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: StructuralEngine

      - uses: actions/checkout@v4
        with:
          repository: Otter-Logic/Core
          path: Core
          token: ${{ secrets.OTTER_CI_TOKEN }}

      # Graphs sits beside Core; MachineLearning references it, so it has to be on disk wherever MachineLearning is.
      - uses: actions/checkout@v4
        with:
          repository: Otter-Logic/Graphs
          path: Graphs
          token: ${{ secrets.OTTER_CI_TOKEN }}

      # Dataset sits beside Core and Graphs under MachineLearning, which references
      # it - the dataset contract moved down there in 2026-09. Same rule as Graphs:
      # miss it and restore fails with NU1101 for OtterLogic.Dataset.
      - uses: actions/checkout@v4
        with:
          repository: Otter-Logic/Dataset
          path: Dataset
          token: ${{ secrets.OTTER_CI_TOKEN }}

      # The machine learning stack, bottom up: the shared base, then the paradigm repo whose methods the engine calls.
      - uses: actions/checkout@v4
        with:
          repository: Otter-Logic/MachineLearning
          path: MachineLearning
          token: ${{ secrets.OTTER_CI_TOKEN }}

      - uses: actions/checkout@v4
        with:
          repository: Otter-Logic/Unsupervised
          path: Unsupervised
          token: ${{ secrets.OTTER_CI_TOKEN }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build StructuralEngine/OtterLogic.slnx -c Release

      - name: Test
        run: dotnet test StructuralEngine/OtterLogic.slnx -c Release --no-build
